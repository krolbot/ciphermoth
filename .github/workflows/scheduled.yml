name: Scheduled checks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Audit backend runtime dependencies
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --require-hashes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Audit the frontend image's file server
        working-directory: docker/frontend/serve
        run: npm audit --audit-level=moderate

  stress:
    name: Stress tests (fuzzing, process kills)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciphermoth_test
          POSTGRES_PASSWORD: ciphermoth_test
          POSTGRES_DB: ciphermoth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciphermoth_test -d ciphermoth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CIPHERMOTH_TEST_DB_URL: postgresql://ciphermoth_test:ciphermoth_test@127.0.0.1:5432/ciphermoth_test
      HYPOTHESIS_PROFILE: stress
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Test
        working-directory: backend
        run: uv run pytest -m "stress or not stress"
