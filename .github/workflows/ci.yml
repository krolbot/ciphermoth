name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check . ../docker/updater

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check . ../docker/updater

      - name: Type check
        working-directory: backend
        run: uv run ty check . ../docker/updater/updater.py

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ciphermoth_test
          POSTGRES_PASSWORD: ciphermoth_test
          POSTGRES_DB: ciphermoth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ciphermoth_test -d ciphermoth_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CIPHERMOTH_TEST_DB_URL: postgresql://ciphermoth_test:ciphermoth_test@127.0.0.1:5432/ciphermoth_test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (ESLint + Prettier + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Test the image's runtime configuration
        run: node --test docker/frontend/runtime-config.test.mjs

  frontend-browser:
    name: Frontend image (CSP in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docker/frontend/browser/package-lock.json

      - name: Build the frontend image
        run: docker build -f docker/frontend/Dockerfile --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__ -t ciphermoth-frontend:browser-test .

      - name: Install the browser
        working-directory: docker/frontend/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check the Content-Security-Policy
        working-directory: docker/frontend/browser
        run: npm test

  images:
    name: Image ${{ matrix.image.name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            args: ""
          - name: frontend
            args: --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__
          - name: updater
            args: ""
        platform:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f docker/${{ matrix.image.name }}/Dockerfile ${{ matrix.image.args }} -t ciphermoth-${{ matrix.image.name }}:ci .

      - name: Check the updater protocol labels
        run: |
          label="$(docker image inspect ciphermoth-${{ matrix.image.name }}:ci --format '{{json .Config.Labels}}')"
          echo "$label"
          case "${{ matrix.image.name }}" in
            updater) echo "$label" | grep -q '"io.ciphermoth.updater-protocol":"2"' ;;
            *) echo "$label" | grep -q '"io.ciphermoth.min-updater-protocol":"2"' ;;
          esac

      - name: Smoke-test the updater
        if: matrix.image.name == 'updater'
        run: |
          docker run --rm --entrypoint python3 ciphermoth-updater:ci /usr/local/lib/ciphermoth/updater.py newer v1.0.1 1.0.0
          docker run --rm --entrypoint sh ciphermoth-updater:ci -c 'cosign version >/dev/null && pg_dump --version && docker compose version && tini --version'
