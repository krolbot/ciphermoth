name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint
        working-directory: backend
        run: uv run ruff check .

      - name: Format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run ty check .

  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Check the SQLite runtime
        working-directory: backend
        run: uv run python -c "import storage, sqlite3; storage.require_supported_sqlite(); print('SQLite', sqlite3.sqlite_version)"

      - name: Test
        working-directory: backend
        run: uv run pytest

  frontend:
    name: Frontend (ESLint + Prettier + Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Test the image's runtime configuration
        run: node --test docker/frontend/runtime-config.test.mjs

  frontend-browser:
    name: Frontend image (CSP in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docker/frontend/browser/package-lock.json

      - name: Build the frontend image
        run: docker build -f docker/frontend/Dockerfile --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__ -t ciphermoth-frontend:browser-test .

      - name: Install the browser
        working-directory: docker/frontend/browser
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check the Content-Security-Policy
        working-directory: docker/frontend/browser
        run: npm test

  images:
    name: Image ${{ matrix.image.name }} (${{ matrix.platform.slug }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            args: ""
          - name: frontend
            args: --build-arg VITE_API_URL=__CIPHERMOTH_API_URL__
        platform:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f docker/${{ matrix.image.name }}/Dockerfile ${{ matrix.image.args }} -t ciphermoth-${{ matrix.image.name }}:ci .

      - name: Check that released updaters refuse the image
        run: |
          label="$(docker image inspect ciphermoth-${{ matrix.image.name }}:ci --format '{{json .Config.Labels}}')"
          echo "$label"
          echo "$label" | grep -q '"io.ciphermoth.min-updater-protocol":"3"'
