name: Updater end-to-end

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/updater-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    name: One-click updates in Compose (${{ matrix.slug }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            slug: amd64
          - runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run the updater scenarios
        run: make test-updater-e2e

      - name: Show leftover containers
        if: failure()
        run: docker ps -a
