name: Frontend image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: frontend-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'krolbot/ciphermoth' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the Lab frontend
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/krolbot/ciphermoth-frontend:sha-${{ github.sha }}
          build-args: VITE_API_URL=__CIPHERMOTH_API_URL__
          labels: |
            org.opencontainers.image.source=https://github.com/krolbot/ciphermoth
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the published image
        env:
          IMAGE: ghcr.io/krolbot/ciphermoth-frontend@${{ steps.image.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
