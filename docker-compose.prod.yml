# Run CipherMoth from prebuilt images: the real, daily-use vault.
# Everything lives in one SQLite file in the vault_data volume. A .env next to
# this file is optional (see .env.prod.example).
name: ciphermoth

services:
  backend:
    image: ghcr.io/krolbot/ciphermoth-backend:${CIPHERMOTH_VERSION:-latest}
    restart: unless-stopped
    environment:
      # The browser origin that serves the UI; CORS must allow it.
      CORS_ORIGINS: '["${CIPHERMOTH_FRONTEND_ORIGIN:-http://localhost:3000}"]'
      # Overrides the per-route rate limits (e.g. 200/hour) when set.
      CIPHERMOTH_RATE_LIMIT: ${CIPHERMOTH_RATE_LIMIT:-}
      CIPHERMOTH_INACTIVITY_MS: ${CIPHERMOTH_INACTIVITY_MS:-120000}
      CIPHERMOTH_HIDDEN_MS: ${CIPHERMOTH_HIDDEN_MS:-60000}
      CIPHERMOTH_WARN_BEFORE_MS: ${CIPHERMOTH_WARN_BEFORE_MS:-60000}
      CIPHERMOTH_DEBOUNCE_MS: ${CIPHERMOTH_DEBOUNCE_MS:-1000}
      CIPHERMOTH_CLIPBOARD_CLEAR_MS: ${CIPHERMOTH_CLIPBOARD_CLEAR_MS:-30000}
      CIPHERMOTH_UPDATE_CHECK_ENABLED: ${CIPHERMOTH_UPDATE_CHECK_ENABLED:-true}
    # Published on localhost only unless CIPHERMOTH_BIND_ADDRESS says otherwise.
    ports:
      - "${CIPHERMOTH_BIND_ADDRESS:-127.0.0.1}:${CIPHERMOTH_BACKEND_PORT:-8000}:80"
    volumes:
      - vault_data:/data

  frontend:
    image: ghcr.io/krolbot/ciphermoth-frontend:${CIPHERMOTH_VERSION:-latest}
    restart: unless-stopped
    environment:
      # The URL the browser uses to reach the API. Injected at container start.
      VITE_API_URL: ${CIPHERMOTH_API_URL:-http://localhost:8000/api}
    ports:
      - "${CIPHERMOTH_BIND_ADDRESS:-127.0.0.1}:${CIPHERMOTH_FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  vault_data:
