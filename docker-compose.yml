# Local development stack: build from source with hot-reload (UI :3000, API :8000).
# The real vault runs from prebuilt GHCR images via docker-compose.prod.yml.
name: ciphermoth-dev

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    command: uvicorn main:app --host 0.0.0.0 --port 80 --reload --reload-dir /app/src
    ports:
      - "127.0.0.1:8000:80"
    environment:
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./backend:/app/src
      - vault_data:/data
    restart: unless-stopped
    networks:
      - ciphermoth

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_PORT: "3000"
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ciphermoth

volumes:
  vault_data:

networks:
  ciphermoth:
